<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empregado</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="page-shell">
        <section class="card">
            <header class="card-header">
                <div>

                    <h1>Cadastro de Medico</h1>
                    <p class="subtitle">Escolha o tipo de médico.</p>
                </div>
            </header>

            <form action="processa.php" method="post" class="form-grid">
                <div class="field-group">
                    <label for="tipo">Tipo de empregado</label>
                    <select name="tipo" id="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="pediatra">Pediatra</option>
                        <option value="anestesista">Anestesista</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" required>
                </div>

                <div class="field-group">
                    <label for="crm">CRM</label>
                    <input type="text" name="crm" id="crm" required>
                </div>

                <div class="field-group">
                    <label for="especialidade">Especialidade</label>
                    <input type="text" name="especialidade" id="especialidade" required>
                </div>

                <div class="field-group">
                    <label for="salarioBase">Salário base (R$)</label>
                    <input type="number" step="0.01" name="salarioBase" id="salarioBase" required>
                </div>

                <div class="field-group">
                    <label for="honorarioHora">Honorário por hora (R$)</label>
                    <input type="number" step="0.01" name="honorarioHora" id="honorarioHora" required>
                </div>

                <fieldset id="panel-pediatra" class="fieldset-panel fieldset-hidden">
                    <legend>Pediatra</legend>
                    <div class="field-group">
                        <label for="horasTrabalhadas">Horas trabalhadas</label>
                        <input type="number" step="0.01" name="horasTrabalhadas" id="horasTrabalhadas">
                    </div>
                    <div class="field-group">
                        <label for="atendeEmDomicilio">Atende em domicílio</label>
                        <input type="checkbox" name="atendeEmDomicilio" id="atendeEmDomicilio" value="1">
                    </div>
                    <div class="field-group">
                        <label for="planoSaude">Plano de saúde</label>
                        <input type="checkbox" name="planoSaude" id="planoSaude" value="1">
                    </div>
                </fieldset>

                <fieldset id="panel-anestesista" class="fieldset-panel fieldset-hidden">
                    <legend>Anestesista</legend>
                    <div class="field-group">
                        <label for="valorAnestesiaEspecial">Valor da anestesia especial (R$)</label>
                        <input type="number" step="0.01" name="valorAnestesiaEspecial" id="valorAnestesiaEspecial">
                    </div>
                    <div class="field-group">
                        <label for="horasAnestesiaEspecial">Horas de anestesia especial</label>
                        <input type="number" step="0.01" name="horasAnestesiaEspecial" id="horasAnestesiaEspecial">
                    </div>
                    <div class="field-group">
                        <label for="qtdehorasAnestesia">Quantidade de horas de anestesia</label>
                        <input type="number" step="0.01" name="qtdehorasAnestesia" id="qtdehorasAnestesia">
                    </div>
                </fieldset>

                <div class="actions">
                    <button type="submit" class="btn-submit">Calcular</button>
                </div>
            </form>

        </section>
    </main>

    <div class="luciene-wrapper" aria-hidden="true">
        <div class="luciene-speech">Estou de olho heeein!!</div>
        <div class="luciene-sprite">
            <div class="luciene-hair"></div>
            <div class="luciene-face">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="glasses">
                    <span class="lens left"></span>
                    <span class="lens right"></span>
                </div>
                <div class="mouth"></div>
            </div>
            <div class="luciene-body"></div>
        </div>
    </div>

    <script>
        const luciene = document.querySelector('.luciene-wrapper');
        const lucieneSpeech = document.querySelector('.luciene-speech');
        const form = document.querySelector('form');
        const tipoSelect = document.getElementById('tipo');
        const panels = {
            pediatra: document.getElementById('panel-pediatra'),
            anestesista: document.getElementById('panel-anestesista')
        };

        const moveLuciene = () => {
            const margin = 32;
            const vw = window.innerWidth - luciene.offsetWidth - margin;
            const vh = window.innerHeight - luciene.offsetHeight - margin;
            if (vw <= 0 || vh <= 0) return;
            const left = Math.random() * vw + margin / 2;
            const top = Math.random() * vh + margin / 2;
            luciene.style.transform = `translate(${left}px, ${top}px)`;
        };

        const updatePanels = () => {
            const selected = tipoSelect.value;
            Object.keys(panels).forEach(key => {
                const panel = panels[key];
                const visible = key === selected;
                panel.classList.toggle('fieldset-hidden', !visible);
                panel.querySelectorAll('input').forEach(input => {
                    if (input.type !== 'checkbox') {
                        input.required = visible;
                    }
                });
            });
        };

        const toastSpeech = message => {
            lucieneSpeech.textContent = message;
            lucieneSpeech.classList.remove('speech-alert');
            lucieneSpeech.classList.add('speech-pop');
            setTimeout(() => {
                lucieneSpeech.classList.remove('speech-pop');
            }, 260);
        };

        form.addEventListener('submit', event => {
            updatePanels();
            if (!form.checkValidity()) {
                event.preventDefault();
                lucieneSpeech.textContent = 'Faça direito seu 71!';
                lucieneSpeech.classList.add('speech-alert');
                lucieneSpeech.classList.add('speech-pop');
                setTimeout(() => {
                    lucieneSpeech.classList.remove('speech-pop');
                }, 260);
                return;
            }
            // se o formulário estiver correto, continua para processa.php
            toastSpeech('Estou de olho heeein!!');
        });

        tipoSelect.addEventListener('change', () => {
            updatePanels();
            toastSpeech('Estou de olho heeein!!');
        });

        window.addEventListener('load', () => {
            updatePanels();
            moveLuciene();
            setInterval(moveLuciene, 5200);
            window.addEventListener('resize', moveLuciene);
        });
    </script>
</body>

</html>
